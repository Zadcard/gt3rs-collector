name: Collect club matches
on:
  schedule:
    # Hourly fallback: the resident collector owns one/five-minute checks when healthy.
    # The hub cron dispatches every five minutes when the resident collector is offline.
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: club-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture and archive valid EA feeds
        env:
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
        run: python collect.py
