name: Validate resident collector
on:
  push:
    paths:
      - 'collect.py'
      - 'daemon.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: docker build --tag fc-clubs-collector:check .
      - name: Import packaged service without credentials
        run: docker run --rm --entrypoint python fc-clubs-collector:check -c "import collect, daemon; assert not collect.TOKEN; assert callable(daemon.run_service)"
