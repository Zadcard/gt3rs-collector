services:
  - type: worker
    name: fc-clubs-collector
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 300
    envVars:
      - key: HUB_URL
        value: https://clubskeep.zadcard06.workers.dev
      - key: COLLECTOR_TOKEN
        sync: false
